# Опционально: при push в GitHub — публикация на Pages (mock).
# Локально то же: npm run build:gh-pages, папку dist залить в Pages вручную.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, add-adaptitive]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build with repo base path
        run: npm run build -- --mode github
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_USE_MOCK: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
